<!doctype html>
<html><head><meta charset="utf-8"><title>ARC Index Benchmark</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html,body{margin:0;height:100%;background:#EEE6D6;overflow:hidden}
canvas{position:absolute;inset:0;margin:auto;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ARC Index benchmark reel: 15 s, every pixel a pure function of t (window.render(t)).
// Measured numbers only (docs/ARC_INDEX_PLAN.md 10.5-10.7, 9.3):
//   the two-denied letter, a model that picks a row, and the three checks' verdicts on it;
//   wrong values accepted: Gemini 3.8 Flash n=20 77 -> 0; Sonnet 5.5 forced pick n=8 16 / 16 / 0;
//   Solari fill + submit 20.5 s -> 6.1 s, 386 ms batched fill.
const W = 1920, H = 1080, DUR = 15;
const C = {
  paper: '#EEE6D6', paper2: '#E3D8C2', card: '#FBF8F1', ink: '#16181F', ink2: '#6B665C',
  red: '#E0452B', redHot: '#FF7B55', blue: '#2449D8', bar: '#D3C9B6', ok: '#1F7A4D',
};
const F = {
  s: (px, it) => `${it ? 'italic ' : ''}400 ${px}px "Instrument Serif"`,
  m: (w, px) => `${w} ${px}px "IBM Plex Mono"`,
  u: (w, px) => `${w} ${px}px "Instrument Sans"`,
};

// ---------- helpers (as in media/arc-index-reel/reel.html) ----------
function rng(s) { const x = Math.sin(s * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eb = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

let g;
function T(s, x, y, font, color, o = {}) {
  const a = o.a ?? 1; if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.font = font; g.fillStyle = color;
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic'; g.letterSpacing = (o.ls || 0) + 'px';
  g.fillText(s, x, y); g.restore();
}
function tw(s, font, ls = 0) { g.save(); g.font = font; g.letterSpacing = ls + 'px'; const w = g.measureText(s).width; g.restore(); return w; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function rise(s, x, y, font, color, px, p, out = 0, a = 1) {
  if (p <= 0 || out >= 1) return;
  const w = tw(s, font);
  g.save(); g.beginPath(); g.rect(x - 30, y - px * 1.02, w + 80, px * 1.32); g.clip();
  T(s, x, y + px * 1.05 * (1 - eo(p)) - px * 1.3 * eio(out), font, color, { a });
  g.restore();
}
function headline(t, words, x, y, px, t0, st, out = 0) {
  let cx = x; const sp = tw(' ', F.s(px));
  words.forEach((w, i) => {
    const o = typeof w === 'string' ? { s: w } : w; const f = F.s(px, o.it);
    rise(o.s, cx, y, f, o.c || C.ink, px, seg(t, t0 + i * st, t0 + i * st + .6), out);
    cx += tw(o.s, f) + sp;
  });
  return cx - x;
}
function slam(drawFn, x, y, p, rot = 0, sc0 = 2.3) {
  if (p <= 0) return;
  const e = eo(p), s = lerp(sc0, 1, e), off = (1 - e) * 30;
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.globalAlpha *= clamp(p * 5);
  g.save(); g.globalCompositeOperation = 'multiply'; g.translate(-off, off * .5); drawFn(C.blue, .7 * (1 - e)); g.restore();
  g.save(); g.globalCompositeOperation = 'multiply'; g.translate(off, -off * .5); drawFn(C.redHot, .7 * (1 - e)); g.restore();
  drawFn(null, 1);
  g.restore();
}
// A hand-drawn outline around a box, drawn along its perimeter as p goes 0 -> 1.
function outline(x, y, w, h, p, color, lw = 5, dash = null) {
  if (p <= 0) return;
  const P = 2 * (w + h), L = P * eio(p);
  g.save(); g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  if (dash) g.setLineDash(dash);
  let px = x, py = y, left = L;
  g.beginPath(); g.moveTo(px, py);
  for (const [dx, dy, len] of [[1, 0, w], [0, 1, h], [-1, 0, w], [0, -1, h]]) {
    const d = Math.min(left, len);
    px += dx * d; py += dy * d; g.lineTo(px, py);
    left -= d; if (left <= 0) break;
  }
  g.stroke(); g.restore();
}
function check(x, y, s, p, color) {    // a tick mark drawn on
  if (p <= 0) return;
  g.save(); g.strokeStyle = color; g.lineWidth = s * .16; g.lineCap = 'round'; g.lineJoin = 'round';
  const a = [x - s * .42, y], b = [x - s * .1, y + s * .32], c = [x + s * .45, y - s * .38];
  const q = eio(p), l1 = .4;
  g.beginPath(); g.moveTo(...a);
  if (q < l1) g.lineTo(lerp(a[0], b[0], q / l1), lerp(a[1], b[1], q / l1));
  else { g.lineTo(...b); const r = (q - l1) / (1 - l1); g.lineTo(lerp(b[0], c[0], r), lerp(b[1], c[1], r)); }
  g.stroke(); g.restore();
}
function cross(x, y, s, p, color) {
  if (p <= 0) return;
  g.save(); g.strokeStyle = color; g.lineWidth = s * .16; g.lineCap = 'round';
  const q1 = eio(clamp(p * 2)), q2 = eio(clamp(p * 2 - 1)), r = s * .38;
  g.beginPath(); g.moveTo(x - r, y - r); g.lineTo(x - r + 2 * r * q1, y - r + 2 * r * q1);
  if (q2 > 0) { g.moveTo(x + r, y - r); g.lineTo(x + r - 2 * r * q2, y - r + 2 * r * q2); }
  g.stroke(); g.restore();
}

// ---------- background: paper, drifting light, dot grid ----------
const GRAIN = [0, 1, 2, 3].map(k => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  const d = x.createImageData(512, 512);
  for (let i = 0; i < 512 * 512; i++) { const v = 128 + (rng(i * .731 + k * 977.1) - .5) * 180; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
});
function drawPaper(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  const lx = 960 + Math.sin(t * .35) * 460, ly = 420 + Math.cos(t * .27) * 180;
  let gr = g.createRadialGradient(lx, ly, 0, lx, ly, 1150);
  gr.addColorStop(0, 'rgba(255,252,244,.9)'); gr.addColorStop(1, 'rgba(255,252,244,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const bx = 1500 - Math.sin(t * .22) * 300;
  gr = g.createRadialGradient(bx, 980, 0, bx, 980, 900);
  gr.addColorStop(0, 'rgba(214,160,110,.16)'); gr.addColorStop(1, 'rgba(214,160,110,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const sp = 44, ox = (t * 6) % sp, breathe = .75 + .25 * Math.sin(t * 2.1);
  g.fillStyle = `rgba(22,24,31,${.09 * breathe})`;
  for (let x = -ox; x < W; x += sp) for (let y = 22; y < H; y += sp) g.fillRect(x, y, 2.4, 2.4);
}

// ---------- persistent chrome ----------
function drawChrome(t) {
  const a = seg(t, .3, .8) * (1 - seg(t, 13.0, 13.3));
  T('ARC INDEX · GROUNDING BENCHMARK', 90, 84, F.m(500, 24), C.ink2, { a, ls: 3 });
  T('MEASURED 2026-09-29', W - 90, 84, F.m(500, 24), C.ink2, { a, ls: 3, align: 'right' });
  if (a > 0) { g.save(); g.globalAlpha = a; g.fillStyle = C.ink; g.fillRect(90, 104, (W - 180) * eio(seg(t, .3, 1.2)), 2); g.restore(); }
}

// ---------- A. title (0 - 3.3) ----------
function drawTitle(t) {
  if (t > 3.6) return;
  const out = seg(t, 2.9, 3.4);
  headline(t, ['Wrong', 'values'], 90, 470, 190, .35, .14, out);
  headline(t, [{ s: 'accepted.', it: true, c: C.red }], 90, 680, 190, .75, .14, out);
  rise('grounded ✓ — but not the truth, and typed into the portal.', 96, 800, F.s(54, true), C.ink, 54, seg(t, 1.3, 1.9), out);
  rise('The failure that matters. A rejected field is left blank for a person: safe.', 96, 880, F.m(500, 28), C.ink2, 28, seg(t, 1.7, 2.3), out);
}

// ---------- B. the dangerous case (3.3 - 7.7) ----------
const COLS = [40, 110, 330, 470, 1090, 1230, 1370];
const ROWS = [
  ['1', '2026-06-14', '36415', 'Routine venipuncture', '$18.00', '$11.40', 'Paid'],
  ['2', '2026-06-14', '99214', 'Office visit, est. patient, mod. MDM', '$412.00', '$0.00', 'Denied'],
  ['3', '2026-06-14', '93000', 'ECG, routine, with interpretation', '$96.00', '$0.00', 'Denied'],
];
const CARD = { x: 200, y: 150, w: 1520, h: 390 };
function rowY(i) { return CARD.y + 195 + i * 62; }
function drawCase(t) {
  if (t < 3.2 || t > 8.0) return;
  const inn = eo(seg(t, 3.25, 3.85)), out = eio(seg(t, 7.35, 7.85));
  g.save(); g.translate(0, (1 - inn) * 60 - out * 80); g.globalAlpha *= inn * (1 - out);
  // the page
  g.save(); g.shadowColor = 'rgba(60,40,20,.18)'; g.shadowBlur = 40; g.shadowOffsetY = 14;
  rr(CARD.x, CARD.y, CARD.w, CARD.h, 14); g.fillStyle = C.card; g.fill(); g.restore();
  T('PAGE 2 · LINE ITEMS · TWO DENIED', CARD.x + 40, CARD.y + 62, F.m(500, 24), C.ink2, { ls: 2 });
  ['#', 'DATE', 'CPT', 'DESCRIPTION', 'BILLED', 'ALLOWED', 'STATUS'].forEach((h, k) =>
    T(h, CARD.x + COLS[k], CARD.y + 128, F.m(600, 22), C.ink2, { ls: 2 }));
  g.fillStyle = C.bar; g.fillRect(CARD.x + 40, CARD.y + 146, CARD.w - 80, 2);
  ROWS.forEach((r, i) => {
    const p = seg(t, 3.5 + i * .12, 3.9 + i * .12); if (p <= 0) return;
    const y = rowY(i) + (1 - eo(p)) * 20;
    r.forEach((c, k) => T(c, CARD.x + COLS[k], y, F.m(k === 2 || k === 6 ? 600 : 400, 28),
      k === 6 && c === 'Denied' ? C.red : C.ink, { a: eo(p) }));
  });
  // the model's pick: row 2, confidently
  outline(CARD.x + 22, rowY(1) - 38, CARD.w - 44, 52, seg(t, 4.05, 4.5), C.red, 5);
  const pk = seg(t, 4.3, 4.6);
  if (pk > 0) {
    const x = CARD.x + CARD.w - 520, y = CARD.y + 20;
    g.save(); g.globalAlpha *= eo(pk); g.translate(0, (1 - eb(pk)) * 16);
    rr(x, y, 490, 64, 32); g.fillStyle = C.ink; g.fill();
    T('model: cpt_code = 99214', x + 30, y + 42, F.m(500, 26), C.card);
    g.restore();
    T('asked for "the one that fits best"', x - 24, y + 42, F.s(32, true), C.ink2, { a: seg(t, 4.5, 4.8), align: 'right' });
  }
  // the other row that fits just as well
  outline(CARD.x + 22, rowY(2) - 36, CARD.w - 44, 52, seg(t, 5.95, 6.35), C.blue, 4, [14, 12]);
  // three checks, same answer
  const CHK = [
    ['presence check', '99214 is on the cited page', 4.75, true],
    ['evidence check', 'its row says Denied, not Paid, and holds $412.00', 5.3, true],
    ['+ uniqueness rule', '2 rows fit: 93000 / 99214', 5.95, false],
  ];
  CHK.forEach(([name, why, t0, pass], k) => {
    const y = 660 + k * 100, p = seg(t, t0, t0 + .45); if (p <= 0) return;
    rise(name, 210, y, F.m(600, 34), C.ink, 34, p);
    rise(why, 640, y, F.s(42, true), pass ? C.ink : C.blue, 42, seg(t, t0 + .08, t0 + .55));
    const vx = 1500, vp = seg(t, t0 + .25, t0 + .6);
    if (pass) {
      check(vx, y - 12, 44, vp, C.red);
      T('ACCEPTED', vx + 50, y, F.m(600, 28), C.red, { a: eo(vp), ls: 2 });
    } else {
      cross(vx, y - 12, 44, vp, C.blue);
      T('REJECTED', vx + 50, y, F.m(600, 28), C.blue, { a: eo(vp), ls: 2 });
    }
  });
  T('accepted = typed into the appeal form, and it is not the right answer: two lines were denied',
    210, 990, F.m(500, 24), C.ink2, { a: seg(t, 5.6, 6.0) * (1 - seg(t, 6.3, 6.5)) });
  slam((col, a) => {
    g.save(); g.globalAlpha *= a; g.rotate(0);
    rr(-300, -54, 600, 108, 10); g.strokeStyle = col || C.blue; g.lineWidth = 7; g.stroke();
    T('BLANK · FOR A HUMAN', 0, 14, F.m(600, 36), col || C.blue, { align: 'center', ls: 3 });
    g.restore();
  }, 1400, 985, seg(t, 6.45, 6.75), -.035);
  g.restore();
}

// ---------- C. the tallies (7.8 - 11.4) ----------
function bars(t, x0, y0, title, sub, items, max, t0) {
  const a = seg(t, t0, t0 + .4); if (a <= 0) return;
  rise(title, x0, y0, F.m(600, 28), C.ink, 28, a);
  rise(sub, x0, y0 + 44, F.m(400, 24), C.ink2, 24, seg(t, t0 + .1, t0 + .5));
  const bw = 520;
  items.forEach(([label, n, col], k) => {
    const y = y0 + 140 + k * 108, p = eo(seg(t, t0 + .35 + k * .22, t0 + 1.1 + k * .22));
    T(label, x0, y, F.m(500, 30), C.ink, { a: seg(t, t0 + .25 + k * .22, t0 + .5 + k * .22) });
    g.fillStyle = 'rgba(22,24,31,.10)'; g.fillRect(x0, y + 18, bw, 30);
    const w = bw * (n / max) * p;
    if (w > 0) { g.fillStyle = col; g.fillRect(x0, y + 18, w, 30); }
    T(String(Math.round(n * p)), x0 + bw + 30, y + 50, F.s(96), col, { a: seg(t, t0 + .35 + k * .22, t0 + .6 + k * .22) });
  });
}
function drawTallies(t) {
  if (t < 7.7 || t > 11.7) return;
  const out = eio(seg(t, 11.15, 11.6));
  g.save(); g.globalAlpha *= 1 - out; g.translate(0, -out * 60);
  headline(t, ['Wrong', 'values', { s: 'accepted', it: true }], 90, 250, 110, 7.8, .1);
  bars(t, 90, 360, 'GEMINI 3.8 FLASH · 5 LETTERS · n=20',
    'shipped prompt · block index · with & without descriptions',
    [['presence check', 77, C.red], ['evidence check', 0, C.ink]], 77, 8.25);
  bars(t, 1010, 360, 'CLAUDE SONNET 5.5 · TWO DENIED LINES · n=8',
    'prompt forced to pick a row · same answers, three checks',
    [['presence check', 16, C.red], ['evidence check', 16, C.red], ['+ uniqueness rule', 0, C.blue]], 16, 8.75);
  rise('No field with a right answer was lost: 8/8 accepted on every one.', 96, 1000, F.s(40, true), C.ink, 40, seg(t, 10.1, 10.6));
  g.restore();
}

// ---------- D. and fast (11.4 - 13.2) ----------
function drawSpeed(t) {
  if (t < 11.3 || t > 13.4) return;
  const out = eio(seg(t, 12.85, 13.25));
  g.save(); g.globalAlpha *= 1 - out;
  rise('FILL + SUBMIT ON SOLARI · 7 FIELDS', 96, 300, F.m(600, 30), C.ink2, 30, seg(t, 11.45, 11.85), out);
  const v = lerp(20.5, 6.1, eio(seg(t, 11.7, 12.35)));
  const pv = seg(t, 11.55, 11.95);
  if (pv > 0 && out < 1) {
    const f = F.s(330), s = v.toFixed(1);
    g.save(); g.beginPath(); g.rect(60, 330, 1100, 420); g.clip();
    T(s, 90, 660 + (1 - eo(pv)) * 300 - out * 400, f, C.ink);
    T('s', 90 + tw(s, f) + 20, 660 + (1 - eo(pv)) * 300 - out * 400, F.s(160, true), C.red);
    g.restore();
  }
  const ps = seg(t, 12.25, 12.55);
  if (ps > 0) {
    T('was 20.5 s', 1000, 470, F.s(80, true), C.ink2, { a: eo(ps) });
    g.fillStyle = C.red; g.fillRect(996, 446, tw('was 20.5 s', F.s(80, true)) * eio(seg(t, 12.35, 12.6)), 6);
  }
  rise('386 ms: all 7 fields in one batched call', 1000, 560, F.m(500, 30), C.ink, 30, seg(t, 12.35, 12.7), out);
  rise('−70.2%', 1000, 690, F.s(120), C.red, 120, seg(t, 12.45, 12.85), out);
  g.restore();
}

// ---------- E. end card (13.2 - 15) ----------
function drawEnd(t) {
  if (t < 13.1) return;
  const p0 = seg(t, 13.2, 13.7);
  if (p0 > 0) {
    const f = F.s(560);
    g.save(); g.beginPath(); g.rect(0, 250, 520, 640); g.clip();
    T('0', 90, 810 + (1 - eo(p0)) * 520, f, C.red);
    g.restore();
  }
  headline(t, ['wrong', 'values'], 420, 560, 150, 13.45, .1);
  headline(t, [{ s: 'reach', it: true }, { s: 'the', it: true }, { s: 'portal.', it: true }], 420, 720, 150, 13.65, .1);
  const u = eio(seg(t, 13.95, 14.35)), uw = tw('portal.', F.s(150, true));
  const px = 420 + tw('reach the ', F.s(150, true));
  if (u > 0) { g.fillStyle = C.red; g.fillRect(px, 750, uw * u, 8); }
  rise('ambiguous, wrong-row or unprovable fields are rejected, and left for a person', 426, 840, F.s(44, true), C.ink, 44, seg(t, 14.0, 14.45));
  rise('Measured 2026-09-29 · synthetic letters · Gemini 3.8 Flash n=20 · Claude Sonnet 5.5 subagents n=8 · plan §10.5–10.7',
    90, 1010, F.m(500, 24), C.ink2, 22, seg(t, 14.15, 14.55));
}

// ---------- frame ----------
function drawScene(t, ctx) {
  g = ctx;
  drawPaper(t);
  drawChrome(t);
  drawTitle(t);
  drawCase(t);
  drawTallies(t);
  drawSpeed(t);
  drawEnd(t);
}
const cv = document.getElementById('c'), G0 = cv.getContext('2d');
const OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; const G1 = OFF.getContext('2d');
window.SAMPLES = 6; // sub-frame samples for motion blur (180° shutter at 60 fps)
window.render = (t, S = window.SAMPLES) => {
  t = clamp(t, 0, DUR - 1e-4);
  const shutter = .5 / 60;
  if (S <= 1) drawScene(t, G0);
  else for (let k = 0; k < S; k++) {
    drawScene(clamp(t - shutter * (1 - k / (S - 1)), 0, DUR), G1);
    G0.setTransform(1, 0, 0, 1, 0, 0); G0.globalAlpha = 1 / (k + 1); G0.drawImage(OFF, 0, 0); G0.globalAlpha = 1;
  }
  g = G0; g.setTransform(1, 0, 0, 1, 0, 0);
  const vg = g.createRadialGradient(960, 540, 420, 960, 540, 1250);
  vg.addColorStop(0, 'rgba(90,60,30,0)'); vg.addColorStop(1, 'rgba(90,60,30,.24)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const fr = Math.floor(t * 60), gt = GRAIN[fr % 4], ox = -Math.floor(rng(fr) * 512), oy = -Math.floor(rng(fr + .5) * 512);
  g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = .32;
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) g.drawImage(gt, x, y);
  g.restore();
  const fade = Math.max(1 - seg(t, 0, .22), seg(t, 14.72, 15));
  if (fade > 0) { g.fillStyle = C.paper; g.globalAlpha = fade; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
};

const fontsToLoad = [F.s(64), F.s(64, true), F.m(400, 30), F.m(500, 30), F.m(600, 30), F.u(500, 30), F.u(600, 30)];
window.ready = document.fonts.ready.then(() => Promise.all(fontsToLoad.map(f => document.fonts.load(f))));

// Preview: autoplay + loop. Space pauses, R restarts. ?t=6.2 freezes; ?clean=1 holds for export.
const Q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (Q.has('clean')) { window.render(0); return; }
  if (Q.has('t')) { window.render(+Q.get('t')); return; }
  let t0 = performance.now(), paused = false, pt = 0;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - pt * 1000; }
    if (e.code === 'KeyR') { t0 = performance.now(); paused = false; }
  });
  (function loop(now) {
    if (!paused) { pt = ((now - t0) / 1000) % DUR; window.render(pt, 2); }
    requestAnimationFrame(loop);
  })(performance.now());
});
</script></body></html>
