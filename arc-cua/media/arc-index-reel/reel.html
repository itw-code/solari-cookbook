<!doctype html>
<html><head><meta charset="utf-8"><title>ARC Index Reel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html,body{margin:0;height:100%;background:#EEE6D6;overflow:hidden}
canvas{position:absolute;inset:0;margin:auto;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ARC Index showreel: 15 s, every pixel a pure function of t (window.render(t)).
// Story (docs/ARC_INDEX_PLAN.md): denial letter -> PageIndex tree -> cited block ->
// portal form via [#N] reflexes -> SimHash check -> receipt. One red thread carries the value.
const W = 1920, H = 1080, DUR = 15;
const C = {
  paper: '#EEE6D6', paper2: '#E3D8C2', card: '#FBF8F1', ink: '#16181F', ink2: '#6B665C',
  red: '#E0452B', redHot: '#FF7B55', blue: '#2449D8', bar: '#D3C9B6',
};
const F = {
  s: (px, it) => `${it ? 'italic ' : ''}400 ${px}px "Instrument Serif"`,
  m: (w, px) => `${w} ${px}px "IBM Plex Mono"`,
  u: (w, px) => `${w} ${px}px "Instrument Sans"`,
};

// ---------- helpers ----------
function rng(s) { const x = Math.sin(s * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const lin = p => p;
const eo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const ei = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eioX = p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2;
const eb = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

let g; // current drawing context
let CZ = 1; // current world zoom (L-space zoom = CZ / K)

function T(s, x, y, font, color, o = {}) {
  const a = o.a ?? 1; if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.font = font; g.fillStyle = color;
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic'; g.letterSpacing = (o.ls || 0) + 'px';
  g.fillText(s, x, y); g.restore();
}
function tw(s, font, ls = 0) { g.save(); g.font = font; g.letterSpacing = ls + 'px'; const w = g.measureText(s).width; g.restore(); return w; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// Mask reveal: text rises from behind a clip line, and leaves upward on `out`.
function rise(s, x, y, font, color, px, p, out = 0, a = 1) {
  if (p <= 0 || out >= 1) return;
  const w = tw(s, font);
  g.save(); g.beginPath(); g.rect(x - 30, y - px * 1.02, w + 80, px * 1.32); g.clip();
  T(s, x, y + px * 1.05 * (1 - eo(p)) - px * 1.3 * eio(out), font, color, { a });
  g.restore();
}
// A headline: words = strings or {s, it, c}; returns total width.
function headline(t, words, x, y, px, t0, st, out = 0, dx = 0) {
  let cx = x; const sp = tw(' ', F.s(px));
  words.forEach((w, i) => {
    const o = typeof w === 'string' ? { s: w } : w; const f = F.s(px, o.it);
    rise(o.s, cx - dx, y, f, o.c || C.ink, px, seg(t, t0 + i * st, t0 + i * st + .6), out);
    cx += tw(o.s, f) + sp;
  });
  return cx - x;
}
// Print-misregistration slam: drawFn(colorOverride, alpha) draws at origin.
function slam(drawFn, x, y, p, rot = 0, sc0 = 2.3) {
  if (p <= 0) return;
  const e = eo(p), s = lerp(sc0, 1, e), off = (1 - e) * 30;
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.globalAlpha *= clamp(p * 5);
  g.save(); g.globalCompositeOperation = 'multiply'; g.translate(-off, off * .5); drawFn(C.blue, .7 * (1 - e)); g.restore();
  g.save(); g.globalCompositeOperation = 'multiply'; g.translate(off, -off * .5); drawFn(C.redHot, .7 * (1 - e)); g.restore();
  drawFn(null, 1);
  g.restore();
}

// ---------- paths ----------
function bez(p0, p1, p2, p3, n = 56) {
  const a = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u;
    a.push([v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
            v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]);
  }
  return a;
}
function mkPath(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, L: cum[cum.length - 1] };
}
function at(P, f) {
  const d = clamp(f) * P.L; let i = 1;
  while (i < P.cum.length - 1 && P.cum[i] < d) i++;
  const k = (d - P.cum[i - 1]) / Math.max(1e-6, P.cum[i] - P.cum[i - 1]);
  return [lerp(P.pts[i - 1][0], P.pts[i][0], k), lerp(P.pts[i - 1][1], P.pts[i][1], k)];
}
function strokeSub(P, a, b, lw, color, alpha = 1) {
  if (b <= a || alpha <= 0) return;
  const da = a * P.L, db = b * P.L;
  g.save(); g.globalAlpha *= alpha; g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); const s = at(P, a); g.moveTo(s[0], s[1]);
  for (let i = 0; i < P.pts.length; i++) if (P.cum[i] > da && P.cum[i] < db) g.lineTo(P.pts[i][0], P.pts[i][1]);
  const e = at(P, b); g.lineTo(e[0], e[1]); g.stroke(); g.restore();
}
function head(P, f, lw, color = C.red) {
  const p = at(P, f);
  g.save(); g.fillStyle = color; g.globalAlpha *= .22; g.beginPath(); g.arc(p[0], p[1], lw * 3.4, 0, 7); g.fill();
  g.globalAlpha /= .22; g.beginPath(); g.arc(p[0], p[1], lw * 1.5, 0, 7); g.fill(); g.restore();
}
function concat(...Ps) { return mkPath(Ps.flatMap(P => P.pts)); }

// ---------- world layout ----------
// W space: the desk (letter stack at 0,0; tree around x 2600). L space lives inside the
// tree's leaf page, scaled 1/K: the cited block, the portal form, the SimHash grid, the receipt.
const K = 7, LEAF = { x: 3260, y: -230 };
const Lp = (x, y, z) => ({ x: LEAF.x + x / K, y: LEAF.y + y / K, z: z * K });

const NODES = [
  { id: 'R', x: 1960, y: 40, w: 300, h: 96, label: 'Denial letter' },
  { id: 'S1', x: 2400, y: -250, w: 240, h: 80, label: '§1 Patient', p: 'R' },
  { id: 'S2', x: 2400, y: -70, w: 240, h: 80, label: '§2 Claim', p: 'R' },
  { id: 'S3', x: 2400, y: 110, w: 240, h: 80, label: '§3 Reason', p: 'R' },
  { id: 'S4', x: 2400, y: 290, w: 240, h: 80, label: '§4 Appeal', p: 'R' },
  { id: 'T1', x: 2830, y: -145, w: 250, h: 80, label: 'Table 1', p: 'S2' },
  { id: 'P2', x: 2830, y: 20, w: 250, h: 80, label: 'Summary', p: 'S2' },
  { id: 'C3', x: 2830, y: 150, w: 250, h: 80, label: 'CARC codes', p: 'S3' },
  { id: 'A4', x: 2830, y: 290, w: 250, h: 80, label: 'Deadline', p: 'S4' },
  { id: 'B5', x: 3260, y: -60, w: 214, h: 80, label: 'paid row', p: 'T1' },
  { id: 'B4', x: 3260, y: -230, w: 1500 / K, h: 780 / K, label: 'p.2 · denied row', p: 'T1', leaf: true },
];
const NM = {}; NODES.forEach((n, i) => { n.i = i; NM[n.id] = n; });
const fs = i => 1.92 + i * .03, fe = i => fs(i) + .55;
// bars on the letter's top page; bar i flies to NODES[i]
const PL = NODES.map((_, i) => ({ x: -250, y: -175 + i * 42, w: 500 * (.5 + .5 * rng(i + 40)) }));
PL[10].w = 440;
function edgePath(n) {
  const P = NM[n.p], a = [P.x + P.w / 2, P.y], b = [n.x - n.w / 2, n.y], mx = (a[0] + b[0]) / 2;
  return mkPath(bez(a, [mx, a[1]], [mx, b[1]], b));
}
NODES.forEach(n => { if (n.p) n.edge = edgePath(n); });
const PULSE = concat(NM.S2.edge, NM.T1.edge, NM.B4.edge);
const REACH = { R: 0, S2: NM.S2.edge.L / PULSE.L, T1: (NM.S2.edge.L + NM.T1.edge.L) / PULSE.L, B4: 1 };

// L-space layout
const FR_LINES = [
  { s: 'Services billed: office visit, established', y: -170 },
  { s: 'patient, level 4 — CPT 99214.', y: -90 },
  { s: 'Denied under reason code CO-16: the claim', y: 30 },
  { s: 'lacks information needed for adjudication.', y: 110 },
];
let HL1, HL2, T1P, T2P, T3P, T4P, ROUTE;
const INP = { x: 2010, y: -180, w: 580, h: 80 }, SEL = { x: 2010, y: -20, w: 580, h: 80 }, BTN = { x: 2010, y: 120, w: 390, h: 86 };
const GX = 2010, GY = 1360, CELL = 60;
const RX = 2770, RY = 1310, RW = 560, RLEN = 880;
const BEFORE = [], AFTER = []; let DIFF = 0;
// 10 flipped bits: the hamming_distance of the live Solari run (arc_index_live_solari_pageindex_20260929-111127.json)
const FLIP = new Set([...Array(64).keys()].sort((a, b) => rng(a + 300) - rng(b + 300)).slice(0, 10));
for (let i = 0; i < 64; i++) { BEFORE.push(rng(i + 100) > .5); AFTER.push(FLIP.has(i) ? !BEFORE[i] : BEFORE[i]); if (BEFORE[i] !== AFTER[i]) DIFF++; }

function layout() {
  g = G0; const f = F.s(64);
  HL1 = { x: -650 + tw('patient, level 4 — CPT ', f), y: -90, w: tw('99214', f) };
  HL2 = { x: -650 + tw('Denied under reason code ', f), y: 30, w: tw('CO-16', f) };
  const s1 = [HL1.x + HL1.w + 14, HL1.y - 20], s2 = [HL2.x + HL2.w + 14, HL2.y - 20];
  T1P = mkPath(bez(s1, [s1[0] + 900, s1[1] - 260], [INP.x - 700, INP.y + 40], [INP.x - 8, INP.y + 40], 90));
  T2P = mkPath(bez(s2, [s2[0] + 900, s2[1] + 160], [SEL.x - 700, SEL.y + 40], [SEL.x - 8, SEL.y + 40], 90));
  T3P = mkPath(bez([BTN.x + BTN.w / 2, BTN.y + BTN.h + 4], [BTN.x + BTN.w / 2, 760], [GX + 240, 880], [GX + 240, GY - 64], 70));
  T4P = mkPath(bez([GX + 486, GY + 240], [2640, GY + 240], [2630, RY - 14], [RX - 50, RY - 14], 50));
  ROUTE = concat(T1P, mkPath([[INP.x, INP.y + 40], [BTN.x + BTN.w / 2, BTN.y + BTN.h + 4]]), T3P, T4P);
}

// ---------- camera ----------
const CAM = [
  { t: 0, x: 320, y: 10, z: .9 },
  { t: 1.88, x: 360, y: 0, z: 1.0, e: lin },
  { t: 2.45, x: 2592, y: 20, z: .97, e: eioX },
  { t: 4.35, x: 2615, y: 5, z: 1.03, e: lin },
  { t: 5.3, ...Lp(0, -40, .9), e: eio },
  { t: 6.88, ...Lp(0, -55, .96), e: lin },
  { t: 7.45, ...Lp(2300, -140, 1.35), e: eioX },
  { t: 7.98, ...Lp(2300, -130, 1.38), e: lin },
  { t: 8.2, ...Lp(2300, 20, 1.35), e: eio },
  { t: 8.42, ...Lp(2300, 30, 1.36), e: lin },
  { t: 8.58, ...Lp(2230, 185, 1.3), e: eio },
  { t: 8.78, ...Lp(2230, 190, 1.32), e: lin },
  { t: 9.05, ...Lp(3100, 0, .8), e: eo },
  { t: 9.38, ...Lp(3120, 0, .82), e: lin },
  { t: 9.92, ...Lp(2450, 1620, 1.0), e: eioX },
  { t: 10.85, ...Lp(2470, 1610, 1.04), e: lin },
  { t: 11.75, ...Lp(3050, 1790, .95), e: eio },
  { t: 11.98, ...Lp(3050, 1800, .97), e: lin },
  { t: 12.4, ...Lp(3120, 1830, 1.9), e: eio },
  { t: 12.95, ...Lp(3140, 1830, 1.95), e: lin },
  { t: 14.1, ...Lp(-380, 1560, .24), e: eioX },
  { t: 15, ...Lp(-360, 1560, .246), e: lin },
];
const SHAKES = [[6.25, 10], [8.95, 14], [11.85, 12], [12.55, 16], [13.55, 5],
  ...Array.from({ length: 8 }, (_, i) => [.12 + .09 * i, i === 7 ? 7 : 3])];
function camAt(t) {
  let i = 1; while (i < CAM.length - 1 && t > CAM[i].t) i++;
  const a = CAM[i - 1], b = CAM[i], p = (b.e || lin)(seg(t, a.t, b.t));
  const z = Math.exp(lerp(Math.log(a.z), Math.log(b.z), p));
  const u = Math.abs(a.z - b.z) / Math.min(a.z, b.z) > .15 ? (1 / a.z - 1 / z) / (1 / a.z - 1 / b.z) : p;
  let sx = 0, sy = 0;
  for (const [t0, A] of SHAKES) if (t > t0) { const d = t - t0, k = A * Math.exp(-d * 9); sx += k * Math.sin(d * 83); sy += k * Math.cos(d * 71); }
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z, r: Math.sin(t * .45) * .004, sx, sy };
}

// ---------- textures (deterministic) ----------
const FIB = document.createElement('canvas'); FIB.width = FIB.height = 1024;
(() => {
  const f = FIB.getContext('2d');
  for (let i = 0; i < 900; i++) {
    const x = rng(i) * 1024, y = rng(i + 5000) * 1024, a = rng(i + 9000) * 6.28, l = 6 + rng(i + 7000) * 26;
    f.strokeStyle = `rgba(${rng(i + 3) > .5 ? '120,95,60' : '255,255,250'},${.05 + rng(i + 11) * .08})`; f.lineWidth = .6 + rng(i + 13);
    f.beginPath(); f.moveTo(x, y); f.quadraticCurveTo(x + Math.cos(a + .6) * l * .6, y + Math.sin(a + .6) * l * .6, x + Math.cos(a) * l, y + Math.sin(a) * l); f.stroke();
  }
  for (let i = 0; i < 40; i++) {
    const x = rng(i + 200) * 1024, y = rng(i + 400) * 1024, r = 30 + rng(i + 600) * 120;
    const gr = f.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(150,120,80,.035)'); gr.addColorStop(1, 'rgba(150,120,80,0)');
    f.fillStyle = gr; f.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
})();
const GRAIN = [0, 1, 2, 3].map(k => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  const d = x.createImageData(512, 512);
  for (let i = 0; i < 512 * 512; i++) { const v = 128 + (rng(i * .731 + k * 977.1) - .5) * 180; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
});

// ---------- background: living paper + zoom-aware dot grid ----------
function drawPaper(t, c) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  const lx = 960 + Math.sin(t * .35) * 460, ly = 420 + Math.cos(t * .27) * 180;
  let gr = g.createRadialGradient(lx, ly, 0, lx, ly, 1150);
  gr.addColorStop(0, 'rgba(255,252,244,.9)'); gr.addColorStop(1, 'rgba(255,252,244,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const bx = 1500 - Math.sin(t * .22) * 300, by = 980;
  gr = g.createRadialGradient(bx, by, 0, bx, by, 900);
  gr.addColorStop(0, 'rgba(214,160,110,.16)'); gr.addColorStop(1, 'rgba(214,160,110,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const ox = -((t * 9) % 1024), oy = -((t * 4) % 1024);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) g.drawImage(FIB, ox + i * 1024, oy + j * 1024);
  // dot grid in world units, two octaves cross-fading with zoom
  const base = 44, lv = Math.log(c.z) / Math.log(4), k = Math.floor(lv), fr = lv - k;
  const breathe = .75 + .25 * Math.sin(t * 2.1);
  for (const [lev, al] of [[k, 1], [k + 1, fr]]) {
    const s = base / Math.pow(4, lev), sp = s * c.z; if (sp < 20 || al < .04) continue;
    const x0 = (960 + c.sx - c.x * c.z) % sp, y0 = (540 + c.sy - c.y * c.z) % sp;
    g.fillStyle = `rgba(22,24,31,${.11 * al * breathe})`;
    for (let x = x0 - sp; x < W; x += sp) for (let y = y0 - sp; y < H; y += sp) g.fillRect(x - 1.3, y - 1.3, 2.6, 2.6);
  }
}

// ---------- scene A: the letter ----------
function sheet(x, y, r, w, h, content) {
  g.save(); g.translate(x, y); g.rotate(r);
  g.fillStyle = 'rgba(70,45,20,.07)'; rr(-w / 2 + 6, -h / 2 + 22, w + 14, h + 6, 10); g.fill();
  g.fillStyle = 'rgba(70,45,20,.10)'; rr(-w / 2 + 8, -h / 2 + 12, w, h, 6); g.fill();
  g.fillStyle = C.card; g.fillRect(-w / 2, -h / 2, w, h);
  g.strokeStyle = 'rgba(22,24,31,.12)'; g.lineWidth = 1.5; g.strokeRect(-w / 2, -h / 2, w, h);
  content && content(); g.restore();
}
function genericBars(i) {
  T('NOTICE', -250, -300, F.s(40), C.ink, { a: .5 });
  g.fillStyle = C.bar; for (let k = 0; k < 13; k++) g.fillRect(-250, -220 + k * 42, 500 * (.45 + .55 * rng(i * 30 + k)), 12);
}
function topPage(t) {
  T('NOTICE OF CLAIM DENIAL', -250, -300, F.s(40), C.ink);
  const n = Math.round(lerp(1, 4, eo(seg(t, .1, 1.1))));
  T(`page ${String(n).padStart(2, '0')} / 04`, -250, -252, F.m(500, 30), C.ink2);
  PL.forEach((b, i) => {
    if (t >= fs(i)) return;
    g.fillStyle = C.bar; g.fillRect(b.x, b.y - 6, b.w, 12);
    if (i === 10) { const p = eo(seg(t, 1.42, 1.72)); g.fillStyle = C.red; g.fillRect(b.x, b.y - 8, b.w * p, 16); }
  });
  g.strokeStyle = 'rgba(22,24,31,.35)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-250, 330); g.lineTo(-40, 330); g.stroke();
  T('signature', -250, 362, F.m(400, 30), C.ink2, { a: .7 });
}
function drawDocs(t) {
  if (t > 2.9) return;
  for (let i = 4; i < 8; i++) {
    const L = .12 + .09 * i, s = L - .3; if (t < s) continue;
    const p = seg(t, s, L), top = i === 7;
    const x = top ? 0 : (rng(i + 1) - .5) * 50, r0 = top ? -.006 : (rng(i + 11) - .5) * .1;
    const y = lerp(-1300, 0, p * p) - Math.sin(seg(t, L, L + .16) * Math.PI) * 10;
    const r = r0 + (1 - p) * (rng(i + 21) - .5) * .5;
    sheet(x, y, r, 620, 800, top ? () => topPage(t) : () => genericBars(i));
  }
}

// ---------- scene B: the tree ----------
function card(x, y, w, h, label, o = {}) {
  g.save(); g.globalAlpha *= o.a ?? 1; g.translate(x, y); const s = o.s ?? 1; g.scale(s, s);
  g.fillStyle = 'rgba(70,45,20,.10)'; rr(-w / 2 + 6, -h / 2 + 9, w, h, 12); g.fill();
  g.fillStyle = C.card; rr(-w / 2, -h / 2, w, h, 12); g.fill();
  g.strokeStyle = o.hot ? C.red : 'rgba(22,24,31,.55)'; g.lineWidth = o.hot ? 4 : 2; g.stroke();
  if (label) T(label, 0, 2, F.s(38), o.hot ? C.red : C.ink, { align: 'center', base: 'middle', a: o.la ?? 1 });
  g.restore();
}
function drawTree(t) {
  if (t < 1.9 || t > 5.4) return;
  const dim = seg(t, 3.3, 3.8), pp = eio(seg(t, 3.2, 4.15));
  const onPath = id => id in REACH;
  NODES.forEach(n => {
    if (!n.p) return; const pr = seg(t, fe(n.i), fe(n.i) + .35); if (pr <= 0) return;
    strokeSub(n.edge, 0, eo(pr), 2.5, C.ink, onPath(n.id) ? .8 : lerp(.8, .28, dim));
  });

  NODES.forEach(n => {

window.render = (t, S = window.SAMPLES) => {
  t = clamp(t, 0, DUR - 1e-4);
  const shutter = .5 / 60;
  if (S <= 1) drawScene(t, G0);
  else for (let k = 0; k < S; k++) {
    drawScene(clamp(t - shutter * (1 - k / (S - 1)), 0, DUR), G1);
    G0.setTransform(1, 0, 0, 1, 0, 0); G0.globalAlpha = 1 / (k + 1); G0.drawImage(OFF, 0, 0); G0.globalAlpha = 1;
  }
  g = G0; g.setTransform(1, 0, 0, 1, 0, 0);
  const vg = g.createRadialGradient(960, 540, 420, 960, 540, 1250);
  vg.addColorStop(0, 'rgba(90,60,30,0)'); vg.addColorStop(1, 'rgba(90,60,30,.24)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const fr = Math.floor(t * 60), gt = GRAIN[fr % 4], ox = -Math.floor(rng(fr) * 512), oy = -Math.floor(rng(fr + .5) * 512);
  g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = .32;
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) g.drawImage(gt, x, y);
  g.restore();
  const fade = Math.max(1 - seg(t, 0, .22), seg(t, 14.72, 15));
  if (fade > 0) { g.fillStyle = C.paper; g.globalAlpha = fade; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
};

const fontsToLoad = [F.s(64), F.s(64, true), F.m(400, 30), F.m(500, 30), F.m(600, 30), F.u(500, 30), F.u(600, 30)];
window.ready = document.fonts.ready.then(() => Promise.all(fontsToLoad.map(f => document.fonts.load(f)))).then(layout);

// Preview: autoplay + loop, no player. Space pauses, R restarts. ?t=6.2 freezes; ?clean=1 holds for export.
const Q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (Q.has('clean')) { window.render(0); return; }
  if (Q.has('t')) { window.render(+Q.get('t')); return; }
  let t0 = performance.now(), paused = false, pt = 0;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - pt * 1000; }
    if (e.code === 'KeyR') { t0 = performance.now(); paused = false; }
  });
  (function loop(now) {
    if (!paused) { pt = ((now - t0) / 1000) % DUR; window.render(pt, 2); }
    requestAnimationFrame(loop);
  })(performance.now());
});
</script></body></html>
